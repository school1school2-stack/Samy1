<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار القرآن الكريم تفسيره وعلومه - د. سامي بن محمد العمر</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #d4af37;
            --bg-color: #fdfaf1;
            --text-color: #222;
            --card-bg: #ffffff;
            --danger: #dc3545;
            --success: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            border-top: 8px solid var(--primary-color);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
            font-size: 1.8rem;
        }

        .header p {
            margin: 5px 0;
            color: #555;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary-color);
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="email"]:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #152860;
        }

        .question-card {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fafafa;
        }

        .question-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .option-label {
            display: block;
            padding: 10px;
            margin: 8px 0;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-label:hover {
            background: #f0f4ff;
            border-color: var(--primary-color);
        }

        .option-label input {
            margin-left: 10px;
        }

        #timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--danger);
            text-align: center;
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>مادة: القرآن الكريم تفسيره وعلومه 📖</h1>
        <p>أستاذ المادة: د. سامي بن محمد العمر</p>
    </div>

    <!-- تنبيه الخطأ -->
    <div id="errorAlert" class="alert alert-danger"></div>

    <!-- شاشة تسجيل الدخول والتحقق -->
    <div id="authScreen">
        <div class="form-group">
            <label for="studentEmail">البريد الإلكتروني المعتمد:</label>
            <input type="email" id="studentEmail" placeholder="أدخل إيميلك المعتمد..." required>
        </div>
        <button class="btn" onclick="verifyStudent()">التحقق وبدء الاختبار 🚀</button>
    </div>

    <!-- شاشة الاختبار -->
    <div id="examScreen" class="hidden">
        <div id="timer">الوقت المتبقي: <span id="timeLeft">--:--</span></div>
        <form id="quizForm">
            <div id="questionsContainer"></div>
            <button type="button" class="btn" onclick="submitExam()">تسليم الاختبار 🏁</button>
        </form>
    </div>

    <!-- شاشة النتيجة -->
    <div id="resultScreen" class="hidden" style="text-align: center;">
        <h2 style="color: var(--success);">تم تسليم الاختبار بنجاح 🎉</h2>
        <p id="studentGreeting" style="font-size: 1.2rem; font-weight: bold;"></p>
        <p>نشكرك على إتمام الاختبار. تم تسجيل إجاباتك بنجاح في النظام.</p>
    </div>
</div>

<script>
    // إعدادات سحابة د. سامي العمر (samy-28452)
    const firebaseConfig = {
        apiKey: "AIzaSyAJKKo_NfmOMA0955ulSRDnwQvfHLeIz_s",
        authDomain: "samy-28452.firebaseapp.com",
        databaseURL: "https://samy-28452-default-rtdb.firebaseio.com",
        projectId: "samy-28452",
        storageBucket: "samy-28452.firebasestorage.app",
        messagingSenderId: "248617107030",
        appId: "1:248617107030:web:1a884c43c2461e24c945f7"
    };

    firebase.initializeApp(firebaseConfig);
    const fsDb = firebase.firestore();
    const rtdb = firebase.database();

    let currentStudent = { name: '', email: '' };
    let timerInterval = null;
    let totalSeconds = 20 * 60; // 20 دقيقة مدة الاختبار

    // قائمة أسئلة التفسير وعلوم القرآن
    const questions = [
        {
            id: 1,
            text: "سؤال 1: ما المنسوب إلى الصحابي من أقوال أو أفعال يسمى في علوم الحديث والتفسير بـ:",
            options: ["المرفوع", "الموقوف", "المقطوع", "المرسل"],
            correct: 1
        },
        {
            id: 2,
            text: "سؤال 2: أول سورة نزلت كاملة في القرآن الكريم هي سورة:",
            options: ["العلق", "الفاتحة", "المدثر", "الإخلاص"],
            correct: 1
        },
        {
            id: 3,
            text: "سؤال 3: المراد بالتفسير بالمأثور هو التفسير المستمد من:",
            options: ["القرآن والسنة وأقوال الصحابة والتابعين", "الرأي والاجتهاد اللغوي", "الاستنباط الأصولي الفقهي", "الفلسفة والتصوف"],
            correct: 0
        },
        {
            id: 4,
            text: "سؤال 4: نزول القرآن الكريم جملة واحدة إلى بيت العزة في السماء الدنيا كان في:",
            options: ["ليلة النصف من شعبان", "ليلة القدر", "يوم عرفة", "شهر رجب"],
            correct: 1
        }
    ];

    async function verifyStudent() {
        const emailInput = document.getElementById("studentEmail").value.trim().toLowerCase();
        const alertBox = document.getElementById("errorAlert");
        alertBox.style.display = "none";

        if (!emailInput) {
            showAlert("يرجى أدخال البريد الإلكتروني.");
            return;
        }

        try {
            // التحقق من قائمة الطلاب المصرح لهم في Firestore
            const docRef = fsDb.collection("allowed_students").doc(emailInput);
            const doc = await docRef.get();

            if (doc.exists) {
                currentStudent.email = emailInput;
                currentStudent.name = doc.data().name || "طالب";
                
                // الانتقال لشاشة الاختبار
                document.getElementById("authScreen").classList.add("hidden");
                document.getElementById("examScreen").classList.remove("hidden");
                renderQuestions();
                startTimer();
            } else {
                showAlert("عذراً، هذا البريد الإلكتروني غير مصرح له بآداء الاختبار حالياً. يرجى مراجعة المحاضر.");
            }
        } catch (error) {
            console.error(error);
            showAlert("حدث خطأ أثناء الاتصال بالخادم. حاول مرة أخرى.");
        }
    }

    function showAlert(msg) {
        const alertBox = document.getElementById("errorAlert");
        alertBox.innerText = msg;
        alertBox.style.display = "block";
    }

    function renderQuestions() {
        const container = document.getElementById("questionsContainer");
        container.innerHTML = "";

        questions.forEach((q, index) => {
            let optionsHtml = "";
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q${q.id}" value="${optIndex}">
                        ${opt}
                    </label>
                `;
            });

            container.innerHTML += `
                <div class="question-card">
                    <div class="question-title">${q.text}</div>
                    ${optionsHtml}
                </div>
            `;
        });
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            totalSeconds--;
            updateTimerDisplay();

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                alert("انتهى الوقت المحدد للاختبار! يتم تسليم الإجابات تلقائياً.");
                submitExam();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        document.getElementById("timeLeft").innerText = 
            `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    async function submitExam() {
        if (timerInterval) clearInterval(timerInterval);

        let score = 0;
        const answers = {};

        questions.forEach(q => {
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (selected) {
                const val = parseInt(selected.value);
                answers[`q${q.id}`] = val;
                if (val === q.correct) {
                    score++;
                }
            } else {
                answers[`q${q.id}`] = -1; // لم يجب
            }
        });

        const totalQuestions = questions.length;
        const finalPercentage = Math.round((score / totalQuestions) * 100);

        try {
            // حفظ النتيجة في Realtime Database
            const safeEmailKey = currentStudent.email.replace(/\./g, '_');
            await rtdb.ref('results/' + safeEmailKey).set({
                name: currentStudent.name,
                email: currentStudent.email,
                score: score,
                total: totalQuestions,
                percentage: finalPercentage,
                submittedAt: new Date().toISOString(),
                answers: answers
            });

            document.getElementById("examScreen").classList.add("hidden");
            document.getElementById("resultScreen").classList.remove("hidden");
            document.getElementById("studentGreeting").innerText = `أهلاً بك يا ${currentStudent.name}`;
        } catch (err) {
            console.error(err);
            alert("حدث خطأ في حفظ النتيجة. يرجى التواصل مع أستاذ المادة.");
        }
    }
</script>
</body>
</html>
