<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة د. سامي العمر - القرآن الكريم وعلومه وتفسيره</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --royal-blue: #1e3a8a; --q-red: #ef4444; --bg-page: #f8fafc; 
            --success-green: #10b981; --k-purple: #7c3aed; --card-border: #e2e8f0;
            --text-color: #1e293b; --card-bg: #ffffff;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; 
            background: var(--bg-page); color: var(--text-color); margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; line-height: 1.6;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .user-header {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center; text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-bottom: 5px solid var(--royal-blue); 
            margin-bottom: 20px; box-sizing: border-box; gap: 15px; flex-wrap: wrap; transition: background 0.5s;
        }
        .header-right { flex: 1; text-align: right; min-width: 140px; }
        .header-center { flex: 0 0 auto; display: flex; justify-content: center; }
        .header-left { flex: 1; text-align: left; min-width: 140px; }

        .user-name { margin: 0; color: var(--royal-blue); font-weight: bold; font-size: 1.3rem; }
        .school-name { margin: 0; color: #64748b; font-weight: bold; font-size: 0.95rem; }
        .logo-box { background: var(--royal-blue); width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.4rem; transition: background 0.5s; }

        .top-action-bar {
            width: 100%; max-width: 850px; background: #1e293b; border-radius: 15px; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px; box-sizing: border-box; gap: 10px; flex-wrap: wrap; z-index: 999;
        }
        .bar-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

        .array-import-box, .search-result-box {
            width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 15px; padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 2px dashed #0284c7; margin-bottom: 25px; box-sizing: border-box; transition: background 0.5s;
        }
        .array-textarea {
            width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px;
            font-family: monospace; font-size: 0.9rem; direction: ltr; text-align: left; outline: none; box-sizing: border-box; resize: vertical; margin-bottom: 10px;
        }

        .auth-card {
            background: var(--card-bg); width: 100%; max-width: 850px; border-radius: 20px; padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; margin-bottom: 25px; transition: background 0.5s;
        }
        .auth-input { width: 80%; max-width: 400px; padding: 15px; border-radius: 10px; border: 2px solid #cbd5e1; margin-bottom: 15px; text-align: center; font-size: 1.1rem; outline: none; }

        .container { width: 100%; max-width: 850px; padding-bottom: 120px; display: none; }
        .question-card { background: var(--card-bg); border-radius: 20px; padding: 25px; margin-bottom: 25px; border: 2px solid var(--card-border); position: relative; text-align: right; box-sizing: border-box; transition: 0.3s, background 0.5s; }
        .question-card::before { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 8px; background: var(--k-purple); transition: background 0.5s; }
        
        .question-card.unanswered-alert { border: 2px solid var(--q-red) !important; background-color: #fff5f5; }
        .question-card.unanswered-alert .q-number-badge { background-color: var(--q-red) !important; }

        .card-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .q-number-badge { background: var(--k-purple); color: white; padding: 2px 15px; border-radius: 50px; font-weight: bold; font-size: 0.9rem; transition: background 0.5s; }
        .type-select { background: #f1f5f9; border: none; padding: 8px; border-radius: 10px; font-weight: bold; font-family: inherit; cursor: pointer; }

        .estieab-box { background: #fff9c4 !important; border: 2px solid #fbc02d; border-radius: 12px; padding: 15px; margin-bottom: 15px; color: #000; font-weight: bold; line-height: 1.8; width: 100%; box-sizing: border-box; text-align: right; min-height: 90px; outline: none; white-space: pre-wrap; font-size: 1.15rem; }
        
        .q-text-input { 
            width: 100%; min-height: 70px; padding: 15px; border: 2px solid #cbd5e1; border-radius: 12px; 
            color: inherit; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; outline: none; 
            text-align: right; box-sizing: border-box; word-wrap: break-word; font-family: inherit; 
            background: rgba(0,0,0,0.02); line-height: 1.8; overflow: hidden; resize: none; 
        }

        .essay-input { width: 100%; min-height: 80px; padding: 12px; border: 2px inset #e2e8f0; border-radius: 12px; background: rgba(0,0,0,0.02); font-weight: bold; color: inherit; margin-top: 10px; outline: none; text-align: right; font-size: 1.1rem; white-space: pre-wrap; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 600px) {
            .options-grid { display: flex; flex-direction: column; }
        }

        .opt-pair-row { display: flex; align-items: center; background: var(--card-bg); border: 1.5px solid #d1d5db; border-radius: 10px; padding: 12px; box-sizing: border-box; cursor: pointer; transition: 0.2s, background 0.5s; }
        .opt-label { font-weight: bold; color: var(--royal-blue); margin-left: 8px; white-space: nowrap; font-size: 1.05rem; flex-shrink: 0; }
        .opt-word { width: 100%; border: none; outline: none; font-weight: bold; color: inherit; background: transparent; text-align: right; font-family: inherit; cursor: inherit; font-size: 1.05rem; }

        .correct-ans-box { margin-top: 15px; padding: 10px; background: rgba(16, 185, 129, 0.1); border-radius: 10px; border: 1px solid #bbf7d0; text-align: right; }
        .correct-input { width: 100%; background: transparent; border: none; outline: none; color: #166534; font-weight: bold; text-align: right; font-family: inherit; }

        .btn { border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 6px; transition: 0.3s; font-family: inherit; font-size: 0.85rem; white-space: nowrap; }
        .btn-add { background: #3b82f6; } .btn-save { background: #a855f7; } .btn-load { background: #4f46e5; }
        .btn-link { background: #06b6d4; } .btn-del { background: #ef4444; } .btn-rename { background: #f59e0b; }
        .btn-clear { background: #64748b; padding: 8px; border-radius: 50%; }

        body.student-mode .top-action-bar, body.student-mode .array-import-box, body.student-mode .search-result-box, body.student-mode .remove-btn, body.student-mode .type-select, body.student-mode .correct-ans-box, body.student-mode .admin-only { display: none !important; }
        body.student-mode .selected-opt { background: rgba(59, 130, 246, 0.2) !important; border: 2px solid var(--royal-blue) !important; }

        #report-modal, #cloud-modal, #history-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; max-width: 700px; max-height: 85%; background: #ffffff; color: #1e293b; z-index: 2000; border-radius: 20px; padding: 25px; overflow-y: auto; box-shadow: 0 0 50px rgba(0,0,0,0.4); }
        .report-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .report-table th, .report-table td { padding: 12px; border: 1px solid #e2e8f0; text-align: center; }
        
        .cloud-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid #e2e8f0; gap: 10px; flex-wrap: wrap; }
        .cloud-item:hover { background: #f8fafc; }
    </style>
</head>
<body>

    <script>
        const themes = [
            { bg: "#f8fafc", primary: "#1e3a8a", purple: "#7c3aed", text: "#1e293b", card: "#ffffff", border: "#e2e8f0" },
            { bg: "#fdf4ff", primary: "#86198f", purple: "#c084fc", text: "#1e293b", card: "#ffffff", border: "#f5d0fe" },
            { bg: "#f0fdf4", primary: "#166534", purple: "#059669", text: "#1e293b", card: "#ffffff", border: "#bbf7d0" },
            { bg: "#fffbeb", primary: "#b45309", purple: "#d97706", text: "#1e293b", card: "#ffffff", border: "#fde68a" },
            { bg: "#fdf2f8", primary: "#9d174d", purple: "#db2777", text: "#1e293b", card: "#ffffff", border: "#fbcfe8" },
            { bg: "#f0f9ff", primary: "#0369a1", purple: "#0284c7", text: "#1e293b", card: "#ffffff", border: "#bae6fd" },
            { bg: "#fafaf9", primary: "#292524", purple: "#78716c", text: "#1c1917", card: "#ffffff", border: "#e7e5e4" },
            { bg: "#fff7ed", primary: "#c2410c", purple: "#ea580c", text: "#1e293b", card: "#ffffff", border: "#ffedd5" },
            { bg: "#f0fdfa", primary: "#0f766e", purple: "#0d9488", text: "#1e293b", card: "#ffffff", border: "#ccfbf1" },
            { bg: "#ecfeff", primary: "#155e75", purple: "#0891b2", text: "#1e293b", card: "#ffffff", border: "#cffafe" },
            { bg: "#f5f3ff", primary: "#4c1d95", purple: "#6d28d9", text: "#1e293b", card: "#ffffff", border: "#ede9fe" },
            { bg: "#f4fef1", primary: "#3f6212", purple: "#65a30d", text: "#1e293b", card: "#ffffff", border: "#ecfccb" },
            { bg: "#fef2f2", primary: "#991b1b", purple: "#dc2626", text: "#1e293b", card: "#ffffff", border: "#fee2e2" },
            { bg: "#e0f7fa", primary: "#00838f", purple: "#00b4d8", text: "#004d40", card: "#ffffff", border: "#b2ebf2" },
            { bg: "#fff0f5", primary: "#d81b60", purple: "#ff69b4", text: "#4a0e17", card: "#ffffff", border: "#ffc0cb" },
            { bg: "#f0f4c3", primary: "#827717", purple: "#a9dfbf", text: "#333d29", card: "#ffffff", border: "#e6ee9c" },
            { bg: "#e8eaf6", primary: "#283593", purple: "#5c6bc0", text: "#1a237e", card: "#ffffff", border: "#c5cae9" },
            { bg: "#fff3e0", primary: "#e65100", purple: "#ff9800", text: "#4e2700", card: "#ffffff", border: "#ffe0b2" },
            { bg: "#e1f5fe", primary: "#0277bd", purple: "#29b6f6", text: "#01579b", card: "#ffffff", border: "#b3e5fc" },
            { bg: "#f3e5f5", primary: "#6a1b9a", purple: "#ab47bc", text: "#4a148c", card: "#ffffff", border: "#e1bee7" },
            { bg: "#f9fbe7", primary: "#558b2f", purple: "#8bc34a", text: "#1b5e20", card: "#ffffff", border: "#f0f4c3" },
            { bg: "#fff8e1", primary: "#f57f17", purple: "#ffca28", text: "#3e2723", card: "#ffffff", border: "#ffecb3" },
            { bg: "#f1f8e9", primary: "#33691e", purple: "#689f38", text: "#1b5e20", card: "#ffffff", border: "#dedef0" }
        ];

        const selectedTheme = themes[Math.floor(Math.random() * themes.length)];
        const root = document.documentElement;
        root.style.setProperty('--royal-blue', selectedTheme.primary);
        root.style.setProperty('--k-purple', selectedTheme.purple);
        root.style.setProperty('--bg-page', selectedTheme.bg);
        root.style.setProperty('--text-color', selectedTheme.text);
        root.style.setProperty('--card-bg', selectedTheme.card);
        root.style.setProperty('--card-border', selectedTheme.border);
    </script>

    <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:1999;" onclick="closeModals()"></div>
    
    <div id="cloud-modal">
        <h2 style="text-align: center; color: var(--royal-blue); margin-top:0;"><i class="fas fa-cloud"></i> النماذج المحفوظة في السحاب</h2>
        <p style="text-align: center; color: #64748b; font-size: 0.9rem;">اختر النموذج لفتحه:</p>
        <div id="cloud-models-list" style="margin-top: 20px; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;"></div>
        <button class="btn" style="background:#64748b; width:100%; margin-top:20px; justify-content:center;" onclick="closeModals()">إغلاق</button>
    </div>

    <!-- نافذة سجل النتائج -->
    <div id="history-modal">
        <h2 style="text-align: center; color: var(--royal-blue);"><i class="fas fa-history"></i> سجل نتائج الاختبارات 📊</h2>
        <div id="history-list" style="margin-top: 20px;"></div>
        <button class="btn" style="background:#64748b; width:100%; margin-top:20px; justify-content:center;" onclick="closeModals()">إغلاق السجل</button>
    </div>

    <div id="report-modal">
        <h2 style="text-align: center; color: var(--royal-blue);" id="report-modal-title">تقرير أداء الطالب 🎯</h2>
        <div id="score-summary" style="text-align: center; font-size: 1.4rem; font-weight: bold; margin: 20px 0;"></div>
        <table class="report-table">
            <thead>
                <tr id="report-table-header"><th>#</th><th>السؤال</th><th>إجابتك</th><th>الصحيحة</th><th>الدرجة</th></tr>
            </thead>
            <tbody id="report-body"></tbody>
        </table>
        <div id="save-review-btn-container" style="margin-top: 20px; text-align: center;"></div>
        <button class="btn" style="background:#64748b; width:100%; margin-top:10px; justify-content:center;" onclick="closeModals()">إغلاق التقرير</button>
    </div>

    <div class="user-header" id="main-header">
        <div class="header-right"><h2 class="user-name">د/ سامي محمد العمر</h2></div>
        <div class="header-center"><div class="logo-box"><i class="fas fa-book-quran"></i></div></div>
        <div class="header-left"><p class="school-name">القرآن الكريم وعلومه وتفسيره 📖</p></div>
    </div>

    <div class="top-action-bar admin-only" id="admin-top-bar">
        <div class="bar-group">
            <span id="current-model-label" style="color: #38bdf8; font-weight: bold; font-size: 0.95rem; margin-left: 5px;">📁 نموذج جديد</span>
            <button class="btn btn-save" onclick="saveToCloud()"><i class="fas fa-save"></i> حفظ</button>
            <button class="btn btn-link" onclick="copyCurrentModelLink()"><i class="fas fa-link"></i> رابط الطلاب</button>
            <button class="btn btn-rename" onclick="renameCurrentModel()"><i class="fas fa-signature"></i> إعادة تسمية</button>
            <button class="btn btn-del" onclick="deleteCurrentModel()"><i class="fas fa-trash"></i> حذف</button>
        </div>
        <div class="bar-group">
            <button class="btn btn-load" onclick="loadFromCloud()"><i class="fas fa-folder-open"></i> فتح نموذج</button>
            <button class="btn btn-add" onclick="addQuestion()"><i class="fas fa-plus"></i> سؤال</button>
            <button class="btn btn-clear" title="مسح الكل" onclick="clearAll()"><i class="fas fa-eraser"></i></button>
        </div>
    </div>

    <div id="student-auth-container" style="display:none;">
        <div class="auth-card">
            <h2 style="color: var(--royal-blue); margin-top: 0;">تسجيل دخول الطالب 🎓</h2>
            <p style="color: #64748b; margin-bottom: 20px;">الرجاء إدخال إيميل منصة مدرستي المعتمد لبدء الاختبار:</p>
            <input type="email" id="studentEmailInput" class="auth-input" placeholder="sxxxxxxx@rb.moe.gov.sa">
            <br>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button class="btn" style="background: var(--success-green); padding: 12px 30px; font-size: 1.1rem;" onclick="verifyStudentEmail()">دخول المنصة 🚀</button>
                <button class="btn" style="background: var(--royal-blue); padding: 12px 20px; font-size: 1rem;" onclick="openStudentHistory()"><i class="fas fa-history"></i> سجل اختباراتي 📊</button>
            </div>
            <p id="auth-status-msg" style="margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- مربع استعلام ومراجعة المعلم -->
    <div class="search-result-box admin-only">
        <label style="display: block; font-weight: bold; color: #0284c7; margin-bottom: 8px;"><i class="fas fa-search"></i> استعلام ومراجعة درجات طالب بإيميله المدرسي (خاص بالمعلم):</label>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="email" id="teacherSearchEmail" class="auth-input" style="flex: 1; margin: 0; font-size: 1rem; padding
